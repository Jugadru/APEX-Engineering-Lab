name: Native Engine Comparison
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Simulation
          ref: 2171247db6824331b714dc2588cda15b4b60a496
          path: core-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Hyper-Engine
          ref: 4e4e75f96f94ce4487e7a3c37862aabcbba649ef
          path: hyper-source
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Execute bounded native comparison
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C core-source rev-parse HEAD)" = 2171247db6824331b714dc2588cda15b4b60a496
          test "$(git -C hyper-source rev-parse HEAD)" = 4e4e75f96f94ce4487e7a3c37862aabcbba649ef
          mkdir -p "$RUNNER_TEMP/native-bridge"
          cp tools/native_bridge/core_probe.gd core-source/tests/lab_bridge_probe.gd
          cp tools/native_bridge/hyper_probe.gd hyper-source/game/tests/lab_bridge_probe.gd
          for engine in core hyper; do
            project=core-source
            if [[ "$engine" = hyper ]]; then project=hyper-source/game; fi
            export XDG_DATA_HOME="$RUNNER_TEMP/native-bridge/$engine-user-data"
            mkdir -p "$XDG_DATA_HOME"
            log="$RUNNER_TEMP/native-bridge/$engine-import.log"
            timeout 300s godot --headless --path "$project" --rendering-method gl_compatibility --editor --import > "$log" 2>&1
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$log"; then exit 1; fi
            timeout 180s godot --headless --path "$project" --rendering-method gl_compatibility --script res://tests/lab_bridge_probe.gd 2>&1 | tee "$RUNNER_TEMP/native-bridge/$engine.log"
          done
          python3 -m engineering_lab.native_bridge_evidence "$RUNNER_TEMP/native-bridge/core.log" "$RUNNER_TEMP/native-bridge/hyper.log" "$RUNNER_TEMP/native-bridge/comparison.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bridge-evidence
          path: ${{ runner.temp }}/native-bridge/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-comparison-report
          path: ${{ runner.temp }}/native-bridge/comparison.json
          retention-days: 7
