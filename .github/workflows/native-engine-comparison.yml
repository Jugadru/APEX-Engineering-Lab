name: Native Engine Comparison
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Simulation
          ref: 2171247db6824331b714dc2588cda15b4b60a496
          path: core-source
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Execute pinned Core2 only; Hyper evidence from its private repository
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C core-source rev-parse HEAD)" = 2171247db6824331b714dc2588cda15b4b60a496
          export XDG_DATA_HOME="$RUNNER_TEMP/core-probe-user"
          mkdir -p "$XDG_DATA_HOME"
          cp tools/native_bridge/core_probe.gd core-source/tests/lab_bridge_probe.gd
          timeout 300s godot --headless --path core-source --rendering-method gl_compatibility --editor --import > "$RUNNER_TEMP/import.log" 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
          timeout 180s godot --headless --path core-source --rendering-method gl_compatibility --script res://tests/lab_bridge_probe.gd 2>&1 | tee "$RUNNER_TEMP/core.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$RUNNER_TEMP/core.log"; then exit 1; fi
          test "$(grep -c '^APEX_BRIDGE_RESULT ' "$RUNNER_TEMP/core.log")" = 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from engineering_lab.native_bridge_evidence import load, compare
          data=json.loads(Path("audit/native_bridge_matched_grid_2012.json").read_text(encoding="utf-8"))
          live=load(Path(os.environ["RUNNER_TEMP"])/"core.log")
          for a,b in zip(live["rows"],data["core"]["rows"]):
              assert {k:v for k,v in a.items() if k!="elapsed_cpu_usec"}=={k:v for k,v in b.items() if k!="elapsed_cpu_usec"}, "pinned Core2 result changed"
          report=compare(live,data["hyper"])
          report["hyper_evidence"]="PINNED_PREVIOUS_NATIVE_RUN"
          report["source_runs"]=data["source_runs"]
          Path(os.environ["RUNNER_TEMP"],"comparison.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-native-probe
          path: |
            ${{ runner.temp }}/core.log
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/comparison.json
          retention-days: 14
