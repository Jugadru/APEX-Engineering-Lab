name: Stage Closure Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Enforce closure for stage transition or changed closure record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          APEX_GITHUB_READ_TOKEN: ${{ github.token }}
        run: python3 -m engineering_lab closure-transition --base-sha "$BASE_SHA"
