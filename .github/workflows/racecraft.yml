name: Racecraft Research Lab
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  racecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact reviewed racecraft suite
        run: python3 -m engineering_lab experiment-racecraft-suite --registry "$RUNNER_TEMP/racecraft"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racecraft-evidence
          path: ${{ runner.temp }}/racecraft/
          retention-days: 7
