name: Physics Research Lab
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run fixed reviewed physics suite at exact SHA
        run: python3 -m engineering_lab experiment-physics-suite --registry "$RUNNER_TEMP/physics"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-evidence
          path: ${{ runner.temp }}/physics/
          retention-days: 7
