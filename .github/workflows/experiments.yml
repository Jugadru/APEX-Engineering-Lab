name: Experimental Engineering
on:
  pull_request:
    branches: [main]
    paths: ['engineering_lab/experimental*.py','engineering_lab/exp_*.py','engineering_lab/__main__.py','.github/workflows/experiments.yml']
permissions:
  contents: read
jobs:
  exact-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fixed bounded experiment
        run: python3 -m engineering_lab experiment-run ordered_commands --id EXP-ORDER-001 --registry "$RUNNER_TEMP/ordered"
      - name: Spatial comparison
        run: python3 -m engineering_lab experiment-run spatial_neighbors --id EXP-SPATIAL-001 --registry "$RUNNER_TEMP/spatial"
      - name: Verify spatial bytes
        run: python3 -m engineering_lab verify --id EXP-SPATIAL-001 --registry "$RUNNER_TEMP/spatial"
      - name: Mathematical comparison
        run: python3 -m engineering_lab experiment-run longitudinal_math --id EXP-MATH-001 --registry "$RUNNER_TEMP/math"
      - name: Verify mathematical bytes
        run: python3 -m engineering_lab verify --id EXP-MATH-001 --registry "$RUNNER_TEMP/math"
      - name: Sensitivity grid
        run: python3 -m engineering_lab experiment-run mass_grip_sensitivity --id EXP-SENS-001 --registry "$RUNNER_TEMP/sensitivity"
      - name: Verify sensitivity bytes
        run: python3 -m engineering_lab verify --id EXP-SENS-001 --registry "$RUNNER_TEMP/sensitivity"
      - name: Pit cost comparison
        run: python3 -m engineering_lab experiment-run pit_cost_comparison --id EXP-PIT-001 --registry "$RUNNER_TEMP/pit"
      - name: Verify pit bytes
        run: python3 -m engineering_lab verify --id EXP-PIT-001 --registry "$RUNNER_TEMP/pit"
      - name: Verify bytes
        run: python3 -m engineering_lab verify --id EXP-ORDER-001 --registry "$RUNNER_TEMP/ordered"
      - name: Scientific report
        run: |
          python3 -m engineering_lab experiment-suite-report \
            --entry "$RUNNER_TEMP/ordered" EXP-ORDER-001 \
            --entry "$RUNNER_TEMP/spatial" EXP-SPATIAL-001 \
            --entry "$RUNNER_TEMP/math" EXP-MATH-001 \
            --entry "$RUNNER_TEMP/sensitivity" EXP-SENS-001 \
            --entry "$RUNNER_TEMP/pit" EXP-PIT-001 \
            --output "$RUNNER_TEMP/scientific-report.json" \
            --markdown "$RUNNER_TEMP/scientific-report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-evidence
          path: |
            ${{ runner.temp }}/ordered/
            ${{ runner.temp }}/spatial/
            ${{ runner.temp }}/math/
            ${{ runner.temp }}/sensitivity/
            ${{ runner.temp }}/pit/
            ${{ runner.temp }}/scientific-report.json
            ${{ runner.temp }}/scientific-report.md
          retention-days: 7
