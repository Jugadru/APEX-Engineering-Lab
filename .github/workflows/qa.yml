name: Engineering Lab QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m engineering_lab demo --registry "$RUNNER_TEMP/apex-demo"
      - run: python -m engineering_lab verify --registry "$RUNNER_TEMP/apex-demo" --id EXP-DEMO-001
      - run: python -m engineering_lab debug-repro-demo --registry "$RUNNER_TEMP/apex-repro-demo"
      - run: python -m engineering_lab debug-repro-check --id BUG-REPRO-DEMO --registry "$RUNNER_TEMP/apex-repro-demo"
      - run: python -m engineering_lab debug-solution-demo --registry "$RUNNER_TEMP/apex-solution-demo"
      - run: python -m engineering_lab debug-solution-review --id BUG-REPRO-DEMO --registry "$RUNNER_TEMP/apex-solution-demo"
